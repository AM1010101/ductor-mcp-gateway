[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ductor-mcp-gateway"
version = "0.1.0"
description = "Authenticated MCP Streamable HTTP sidecar for Ductor's internal API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ductor MCP Gateway contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.29,<2",
  "pydantic>=2.12,<3",
  "starlette>=0.46,<2",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "aiohttp>=3.10,<4",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
ductor-mcp-gateway = "ductor_mcp_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ductor_mcp_gateway"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ductor_mcp_gateway"]
mypy_path = "src"
warn_unreachable = true
