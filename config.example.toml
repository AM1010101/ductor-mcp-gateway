[server]
host = "127.0.0.1"
port = 8798
allow_non_loopback = false
# Add the public hostname when Cloudflare Tunnel preserves that Host header.
allowed_hosts = ["127.0.0.1:8798", "localhost:8798"]
# Normally empty for non-browser MCP clients. Add exact browser origins if needed.
allowed_origins = []

[ductor]
url = "http://127.0.0.1:8799"
timeout_seconds = 900.0
max_response_bytes = 1048576
# Current Ductor runtimes inject this bearer token for their internal API.
# Leave token_file unset to support the injected environment variable. Older
# unauthenticated loopback-only runtimes also work when neither source is set.
token_env = "DUCTOR_INTERAGENT_TOKEN"
# token_file = "ductor-internal.token"

[auth]
# Relative paths resolve beside this configuration file.
token_file = "gateway.token"
token_env = "DUCTOR_MCP_GATEWAY_TOKEN"

[policy]
allowed_agents = ["main"]
allowed_tools = [
  "ductor_agents_list",
  "ductor_agent_message",
  "ductor_agent_message_async",
  "ductor_tasks_create",
  "ductor_tasks_list",
  "ductor_tasks_resume",
  "ductor_tasks_cancel",
]

[limits]
max_body_bytes = 262144
rate_limit_per_minute = 60
max_sessions = 32
session_idle_seconds = 1800.0
max_concurrent_requests = 100

[logging]
level = "INFO"
